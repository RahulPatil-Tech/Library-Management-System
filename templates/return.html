<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Return Book</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 40px;
      color: #333;
    }
    h2 {
      color: #2c3e50;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 400px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    select, input[type="number"] {
      width: 100%;
      padding: 8px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background: #e67e22;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #ca6f1e;
    }
    .nav {
      margin-top: 20px;
    }
    .nav a {
      text-decoration: none;
      color: #3498db;
      margin-right: 10px;
    }
    .nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2> Return a Book</h2>

  <form method="POST">
    <label>Member:</label>
    <select name="member_id" required>
      <option value="">-- Select Member --</option>
      {% for m in members %}
        <option value="{{ m.id }}">{{ m.name }}</option>
      {% endfor %}
    </select>

    <label>Book:</label>
    <select name="book_id" required>
      <option value="">-- Select Book --</option>
      {% for b in books %}
        <option value="{{ b.id }}">{{ b.title }}</option>
      {% endfor %}
    </select>

    <label>Fee (₹):</label>
    <input name="fee" type="number" step="0.01" placeholder="Enter late fee">

    <button type="submit"> Return Book</button>
  </form>

  <div class="nav">
    <a href="/books"> Books</a> |
    <a href="/members"> Members</a> |
    <a href="/issue"> Issue</a>
  </div>
</body>
</html>
